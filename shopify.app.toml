# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "0c6afe04bdb857fd30f081fd555feb6b"
name = "Omni Target"
application_url = "https://app.omnitarget.co"
embedded = false

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri               = "/api/webhooks/privacy"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_all_orders,read_analytics,read_customers,read_discounts,read_inventory,read_legal_policies,read_locales,read_locations,read_marketing_integrated_campaigns,read_marketing_events,read_markets,read_metaobject_definitions,read_metaobjects,read_orders,read_product_listings,read_products,read_publications,read_reports,read_returns,read_shipping"
optional_scopes = [ ]
use_legacy_install_flow = true

[auth]
redirect_urls = [
  "https://app.omnitarget.co/api/auth/shopify/callback",
  "http://localhost:3000/api/auth/shopify/callback",
]

[build]
automatically_update_urls_on_dev = true
# dev_store_url = "your-dev-store.myshopify.com"   # optional: skips the store prompt

[pos]
embedded = false
