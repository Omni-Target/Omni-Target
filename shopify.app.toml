# Omni Target — Shopify App Configuration
# Generated: 2026-05-25
#
# This file is the canonical source of truth for Shopify Partner Dashboard
# configuration. Keep it in sync with any changes made via the UI.
#
# Docs: https://shopify.dev/docs/apps/build/cli-for-apps/app-configuration

name = "Omni Target"
client_id = "0c6afe04bdb857fd30f081fd555feb6b"
application_url = "https://app.omnitarget.co"
embedded = false

[access_scopes]
# Minimal read-only scopes needed for pre-spend intelligence briefs.
# Scopes are intentionally narrow — no write access is requested.
scopes = "read_products,read_orders,read_analytics,read_customers"

[auth]
redirect_urls = [
  "https://app.omnitarget.co/api/auth/shopify/callback",
]

[webhooks]
api_version = "2026-01"

  # ── Mandatory Privacy / GDPR Webhooks ─────────────────────────────────────
  # Shopify requires all apps to register these three endpoints and respond with
  # 200 OK. Failure to comply blocks app approval in the Partner Dashboard.
  # Verified via HMAC-SHA256 using SHOPIFY_WEBHOOK_SECRET.
  #
  # Endpoint: /api/webhooks/privacy
  # Auth:     Public (bypasses Clerk — see src/proxy.ts)
  # Handler:  src/app/api/webhooks/privacy/route.ts

  [[webhooks.subscriptions]]
  topics = ["customers/data_request"]
  uri    = "https://app.omnitarget.co/api/webhooks/privacy"

  [[webhooks.subscriptions]]
  topics = ["customers/redact"]
  uri    = "https://app.omnitarget.co/api/webhooks/privacy"

  [[webhooks.subscriptions]]
  topics = ["shop/redact"]
  uri    = "https://app.omnitarget.co/api/webhooks/privacy"

[app_proxy]
# No app proxy configured — Omni Target is a standalone SaaS, not an
# embedded Shopify theme extension.

[pos]
embedded = false
