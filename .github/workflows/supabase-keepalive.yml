name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 3 days at 05:00 UTC (well within Supabase's 7-day inactivity pause threshold)
    - cron: '0 5 */3 * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

# Interim only: Phase S2.3 replaces this workflow with nightly encrypted
# pg_dump backups (which also generate database activity). It is not a
# production-reliability mechanism.
#
# The API key comes ONLY from repository secrets — never hard-code a key here
# (this repository is public). Required secret: SUPABASE_ANON_KEY or
# NEXT_PUBLIC_SUPABASE_ANON_KEY.

jobs:
  keepalive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive query to Supabase PostgREST
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://bafwrcyruaxzojwofxym.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::Repository secret SUPABASE_ANON_KEY (or NEXT_PUBLIC_SUPABASE_ANON_KEY) is not set."
            exit 1
          fi

          ping() {
            curl -s -o response.json -w "%{http_code}" "$1" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
          }

          # After migration 0012_rls_lockdown the anon key can only call
          # keepalive_ping(); before it, fall back to the original table ping.
          HTTP_STATUS=$(ping "${SUPABASE_URL}/rest/v1/rpc/keepalive_ping")
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "keepalive_ping unavailable (HTTP ${HTTP_STATUS}); falling back to table ping"
            HTTP_STATUS=$(ping "${SUPABASE_URL}/rest/v1/rate_limits?select=count")
          fi

          echo "Response HTTP Status: ${HTTP_STATUS}"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Successfully pinged Supabase. Database activity recorded; pause timer reset."
          else
            echo "::error::Keep-alive request failed with HTTP status ${HTTP_STATUS}"
            exit 1
          fi
