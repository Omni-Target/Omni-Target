name: CI

# S2.1 (OPS-01): every change to staging and main must type-check, lint, pass
# its tests and build. Runs without repository secrets, so it also works on
# pull requests from forks. The values below are placeholders for the build.

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_APP_URL: https://ci.invalid
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2kuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build a fresh database from the 0017 baseline
        run: node supabase/provision.mjs --baseline-only
      - name: Compare with the staging schema at 0017
        run: node supabase/schema-catalog.mjs --compare supabase/baseline/catalog-0017.json
      - name: Apply later migrations
        run: node supabase/migrate.mjs up
      - name: Database tests
        run: pnpm test:db
